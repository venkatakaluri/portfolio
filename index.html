        tailwind.config = {

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); 
            color: #fff; 
            overflow-x: hidden;
            font-family: 'Syne', sans-serif;
        }
        
        /* Floating orbs animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(-10px) rotate(-5deg); }
            75% { transform: translateY(-25px) rotate(3deg); }
        }
        
        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(280px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(280px) rotate(-360deg); }
        }

        @keyframes orbitMobile {
            0% { transform: rotate(0deg) translateX(140px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(140px) rotate(-360deg); }
        }
        
        .tech-orbit {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: orbit 25s linear infinite;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .tech-orbit:hover {
            transform: scale(1.2);
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
        }
        
        .tech-orbit img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }
        
        .orbit-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        @media (max-width: 768px) {
            .orbit-container {
                width: 320px;
                height: 320px;
            }
            .tech-orbit {
                width: 55px;
                height: 55px;
                animation: orbitMobile 20s linear infinite;
            }
            .tech-orbit img {
                width: 28px;
                height: 28px;
            }
        }
        
        .tech-orbit:nth-child(1) { animation-delay: 0s; }
        .tech-orbit:nth-child(2) { animation-delay: -3s; }
        .tech-orbit:nth-child(3) { animation-delay: -6s; }
        .tech-orbit:nth-child(4) { animation-delay: -9s; }
        .tech-orbit:nth-child(5) { animation-delay: -12s; }
        .tech-orbit:nth-child(6) { animation-delay: -15s; }
        .tech-orbit:nth-child(7) { animation-delay: -18s; }
        .tech-orbit:nth-child(8) { animation-delay: -21s; }
        
        .profile-ring {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 3px solid rgba(0, 255, 136, 0.3);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.4), inset 0 0 60px rgba(0, 255, 136, 0.2);
        }

        @media (max-width: 768px) {
            .profile-ring {
                width: 200px;
                height: 200px;
            }
        }
        
        .profile-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .glow-text {
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        
        .card-glass:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 255, 136, 0.4);
            transform: translateY(-5px);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #00ff88; border-radius: 3px; }
    </style>
</head>
