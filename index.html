    <script>
        // THREE.JS BACKGROUND INITIALIZATION
        const init3D = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;
            camera.position.y = 5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const composer = new THREE.EffectComposer(renderer);
            composer.addPass(new THREE.RenderPass(scene, camera));
            
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
            composer.addPass(bloomPass);

            const gridHelper = new THREE.GridHelper(200, 100, 0x00f3ff, 0x111111);
            gridHelper.position.y = -5;
            scene.add(gridHelper);

            const snakeSegments = [];
            const numSegments = 20;
            const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0x00ff41, wireframe: true }));
            scene.add(head);
            snakeSegments.push(head);

            for (let i = 0; i < numSegments; i++) {
                const seg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshBasicMaterial({ color: 0x008f24, wireframe: true }));
                scene.add(seg);
                snakeSegments.push(seg);
            }

            const mouse = new THREE.Vector2();
            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            const animate = () => {
                requestAnimationFrame(animate);
                const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
                const dir = vector.sub(camera.position).normalize();
                const distance = -camera.position.z / dir.z * 1.5;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                
                head.position.lerp(pos, 0.1);
                for (let i = snakeSegments.length - 1; i > 0; i--) {
                    snakeSegments[i].position.lerp(snakeSegments[i-1].position, 0.2);
                }
                gridHelper.position.z = (Date.now() * 0.002) % 2;
                composer.render();
            };
            animate();
        };
        window.addEventListener('load', init3D);
    </script>
