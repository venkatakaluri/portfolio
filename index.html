    <script>
        const init3D = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;
            camera.position.y = 5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = 1.2;
            bloomPass.radius = 0;

            const composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            const gridHelper = new THREE.GridHelper(200, 100, 0x00f3ff, 0x111111);
            gridHelper.position.y = -5;
            scene.add(gridHelper);

            const snakeSegments = [];
            const numSegments = 30;
            
            const headGeo = new THREE.BoxGeometry(1.2, 0.8, 1.5);
            const headMat = new THREE.MeshBasicMaterial({ color: 0x00ff41, wireframe: true });
            const head = new THREE.Mesh(headGeo, headMat);
            scene.add(head);
            snakeSegments.push(head);

            const bodyGeo = new THREE.BoxGeometry(0.8, 0.6, 0.8);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0x008f24, wireframe: true });

            for (let i = 0; i < numSegments; i++) {
                const segment = new THREE.Mesh(bodyGeo, bodyMat);
                segment.position.x = i;
                scene.add(segment);
                snakeSegments.push(segment);
            }

            const mouse = new THREE.Vector2();
            const target = new THREE.Vector3();
            
            window.addEventListener('mousemove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            });

            const particlesGeo = new THREE.BufferGeometry();
            const particleCount = 200;
            const posArray = new Float32Array(particleCount * 3);
            for(let i = 0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 50;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({ size: 0.1, color: 0xbd00ff });
            const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particlesMesh);

            const animate = () => {
                requestAnimationFrame(animate);
                const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5);
                vector.unproject(camera);
                const dir = vector.sub(camera.position).normalize();
                const distance = -camera.position.z / dir.z * 1.5;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                
                target.copy(pos);
                head.position.lerp(target, 0.1);
                head.rotation.x += 0.01;
                head.rotation.y += 0.02;

                for (let i = snakeSegments.length - 1; i > 0; i--) {
                    snakeSegments[i].position.lerp(snakeSegments[i-1].position, 0.3);
                    snakeSegments[i].lookAt(snakeSegments[i-1].position);
                }

                gridHelper.position.z = (Date.now() * 0.002) % 2;
                particlesMesh.rotation.y += 0.001;
                composer.render();
            };
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        window.addEventListener('load', init3D);
    </script>
